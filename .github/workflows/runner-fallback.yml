name: Runner fallback

# When GitHub refuses to start hosted jobs (free minutes gone, a failed payment,
# a spending limit), CI and Deploy fail without a runner ever picking them up.
# This re-dispatches the refused run on the self-hosted runner on the VPS
# (labels self-hosted + b3-fallback), which costs no Actions minutes.
#
# It runs on that runner itself, since a hosted job would be refused too, and
# only for failed runs, so a healthy month never wakes it. A re-dispatched run is
# self-hosted and cannot be refused for billing, so this never loops.
#
# To skip the wasted hosted attempt while billing stays broken, set the repo
# variable RUNNER=self-hosted; every job then starts on the VPS. Delete it once
# hosted runs work again. Maintenance is manual: rerun it with runner=self-hosted.

on:
  workflow_run:
    workflows: [CI, Deploy]
    types: [completed]

permissions:
  actions: write   # createWorkflowDispatch
  checks: read     # the annotation that says why a job never started
  contents: read

jobs:
  fallback:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: [self-hosted, b3-fallback]
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            // A fork's code never runs on the VPS.
            if (run.head_repository?.full_name !== `${owner}/${repo}`) {
              return core.notice(`run ${run.id} is from a fork; no fallback`);
            }
            const BILLING = /billing|spending limit|payments have failed/i;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,
              { owner, repo, run_id: run.id, filter: "latest" });
            let refused = false;
            for (const job of jobs) {
              // A job that had a runner failed on its own merits.
              if (job.conclusion !== "failure" || job.runner_name) continue;
              const { data } = await github.rest.checks.listAnnotations(
                { owner, repo, check_run_id: job.id });
              if (data.some(a => BILLING.test(a.message))) { refused = true; break; }
            }
            if (!refused) return core.info(`${run.name} ${run.id} failed on its own; nothing to do`);

            const inputs = { runner: "self-hosted" };
            let workflow = "ci.yml", ref = run.head_branch;
            if (run.name === "Deploy") {
              workflow = "deploy.yml"; ref = "main"; inputs.sha = run.head_sha;
              // A dispatched deploy skips the guard's "CI is green" check, so
              // only ship a commit CI actually passed.
              if (run.event === "workflow_run") {
                const ci = await github.rest.actions.listWorkflowRuns({ owner, repo,
                  workflow_id: "ci.yml", head_sha: run.head_sha, status: "success", per_page: 1 });
                if (!ci.data.total_count) {
                  return core.warning(`no green CI for ${run.head_sha}; not deploying it`);
                }
              }
            }
            await github.rest.actions.createWorkflowDispatch(
              { owner, repo, workflow_id: workflow, ref, inputs });
            core.notice(`${run.name} ${run.id} was refused for billing; re-dispatched ${workflow}@${ref} on the self-hosted runner`);
