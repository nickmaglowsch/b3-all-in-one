# Production stack on the VPS. Postgres/Caddy/Redis are the shared infra
# (~/infra/docker-compose.yml) — this file brings up only api + worker and joins
# the external `shared` network so Caddy can reach b3_api:8000 by name.
# No ports are published: Caddy terminates TLS for b3-api.duckdns.org.
#
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
services:
  api:
    build:
      context: .
      dockerfile: platform/Dockerfile
    container_name: b3_api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@infra_postgres:5432/${POSTGRES_DB}
      ENGINE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@infra_postgres:5432/${POSTGRES_DB}
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_IRPF: ${STRIPE_PRICE_IRPF}
      STRIPE_PRICE_MERCADO: ${STRIPE_PRICE_MERCADO}
      STRIPE_PRICE_INDICE: ${STRIPE_PRICE_INDICE}
      STRIPE_PRICE_BENCH: ${STRIPE_PRICE_BENCH}
      STRIPE_PRICE_EMPRESARIAL: ${STRIPE_PRICE_EMPRESARIAL}
      UPLOADS_DIR: /data/uploads
      ARTIFACTS_DIR: /data/artifacts
      RUN_MIGRATIONS: "1"   # entrypoint runs `alembic upgrade head` before uvicorn
    volumes:
      - uploads_data:/data/uploads
      - artifacts_data:/data/artifacts
    networks:
      - shared
    # The api spawns engine subprocesses of its own: /portfolio/target gathers one
    # advise_weights per strategy sleeve, and each builds the whole market plane
    # (~1.3 GB peak). Three sleeves on a cold cache is ~4 GB in this container
    # alone, so it needs a ceiling as much as the worker does — see below.
    mem_limit: ${API_MEM_LIMIT:-3g}
    cpus: ${API_CPUS:-2}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: platform/Dockerfile
    container_name: b3_worker
    command: ["python", "-m", "platform_app.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@infra_postgres:5432/${POSTGRES_DB}
      ENGINE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@infra_postgres:5432/${POSTGRES_DB}
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY}
      UPLOADS_DIR: /data/uploads
      ARTIFACTS_DIR: /data/artifacts
    volumes:
      - uploads_data:/data/uploads       # same volumes as api: reads files the api saved,
      - artifacts_data:/data/artifacts   # writes backtest artifacts the api serves back
    networks:
      - shared
    # Nothing here had a ceiling, and that is how a backtest took the site down.
    # One engine subprocess peaks at ~1.3 GB building the market plane and burns a
    # core for ~30s; the worker runs two at a time (worker.py concurrency=2). With
    # no limit those two are free to push a shared VPS into swap, at which point
    # every process on the box stalls on page faults — including uvicorn's single
    # event loop, which is why /health hung alongside everything else.
    #
    # Bounded, the same overrun is a failed run with a readable error
    # (subprocs.run names the signal) instead of an unreachable API. The defaults
    # are the measured peak plus headroom for a market plane larger than the one
    # they were measured against; lower them in .env.prod on a smaller box.
    mem_limit: ${WORKER_MEM_LIMIT:-4g}
    cpus: ${WORKER_CPUS:-2}
    restart: unless-stopped

  # Scheduled market-data refresh (prices nightly, CVM fundamentals weekly). Its
  # own service so a multi-hour run never sits in front of a user's import or
  # backtest in the two-slot `worker`. This is also the process that puts the cron
  # schedule in motion — procrastinate defers periodic tasks from the worker that
  # listens on their queue.
  ingest:
    build:
      context: .
      dockerfile: platform/Dockerfile
    container_name: b3_ingest
    command: ["python", "-m", "platform_app.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@infra_postgres:5432/${POSTGRES_DB}
      ENGINE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@infra_postgres:5432/${POSTGRES_DB}
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY}
      WORKER_QUEUES: ingest
      # EDGAR requires a declaring User-Agent. The client defaults to one
      # naming this project, so the scheduled job runs unconfigured; set this to
      # a contact of your own when running against your own domain.
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      # Alpha Vantage keys the US price, listing and benchmark ingests. Kept out
      # of the committed env_file like the Stripe secrets; compose interpolates.
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY:-}
      # Nasdaq Data Link, for the WIKI bulk backfill. Free key, one request
      # for the whole 1962..2018 export. Same handling as the keys above.
      NASDAQ_DATA_LINK_API_KEY: ${NASDAQ_DATA_LINK_API_KEY:-}
      # Massive (formerly Polygon.io) keys the US daily refresh: one grouped
      # request per session for the whole market, plus the split feed that
      # re-adjusts stored history. Free key, same handling as the others.
      MASSIVE_API_KEY: ${MASSIVE_API_KEY:-}
      MASSIVE_DELAY_SECONDS: ${MASSIVE_DELAY_SECONDS:-}
      ALPHAVANTAGE_RATE_PER_MIN: ${ALPHAVANTAGE_RATE_PER_MIN:-}
      ALPHAVANTAGE_DAILY_BUDGET: ${ALPHAVANTAGE_DAILY_BUDGET:-}
      UPLOADS_DIR: /data/uploads
      ARTIFACTS_DIR: /data/artifacts
    volumes:
      # COTAHIST/CVM archives land here. Without a volume the scheduled run
      # re-downloads 1994..today on every container restart.
      - engine_data:/opt/engine/data
    networks:
      - shared
    # A COTAHIST parse holds a year of bars in memory and this runs unattended at
    # 06:00, so it gets the same treatment. Roomier than the worker because a
    # first full backfill is a bigger frame than any single backtest, and it runs
    # one job at a time.
    mem_limit: ${INGEST_MEM_LIMIT:-4g}
    cpus: ${INGEST_CPUS:-2}
    restart: unless-stopped

volumes:
  uploads_data:
  artifacts_data:
  engine_data:

networks:
  shared:
    external: true
