# Local development stack. Mirrors the prod VPS shared-infra pattern
# (infra_postgres/caddy) but self-contained — no deploys from here.
services:
  postgres:
    image: imresamu/postgis:16-3.5
    container_name: b3_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: b3
    ports:
      # Loopback only. Docker publishes through DOCKER-USER, which bypasses ufw, so
      # a bare "5432:5432" exposes postgres (password `devpassword`, every tenant's
      # book) to anything that can route to this host.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: platform/Dockerfile
    container_name: b3_api
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/b3
      # Engine market plane (in-container host is `postgres`). Overrides the
      # env_file's localhost value.
      ENGINE_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/b3
      # Self-contained local stack: stub IBOV/CDI so backtests need no external
      # network (valid for price-only strategies). Unset to fetch real benchmarks.
      ENGINE_BENCH_OFFLINE: "1"
      UPLOADS_DIR: /data/uploads
      ARTIFACTS_DIR: /data/artifacts
      RUN_MIGRATIONS: "1"   # api runs `alembic upgrade head` before uvicorn (entrypoint)
      # Stripe secrets stay out of the committed env_file — compose interpolates
      # them from .env. Only the api talks to Stripe; the worker never does.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - uploads_data:/data/uploads       # shared with worker so saved files are visible to jobs
      - artifacts_data:/data/artifacts   # shared with worker so backtest artifacts are readable
    ports:
      # Loopback only, same reason as postgres — and this stack runs with
      # ENVIRONMENT=development, which mounts POST /auth/dev-login: an
      # unauthenticated JWT minter for a seeded trader-tier user.
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles: ["app"]

  worker:
    build:
      context: .
      dockerfile: platform/Dockerfile
    container_name: b3_worker
    command: ["python", "-m", "platform_app.worker"]
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/b3
      ENGINE_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/b3
      ENGINE_BENCH_OFFLINE: "1"
      UPLOADS_DIR: /data/uploads
      ARTIFACTS_DIR: /data/artifacts
    volumes:
      - uploads_data:/data/uploads       # same volume as api: reads files the api saved
      - artifacts_data:/data/artifacts   # backtest jobs write here; api reads curves back
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["app"]

  # Scheduled market-data refresh. Its own service, not a second role for `worker`,
  # because an ingestion run is minutes to hours and would otherwise sit in front of
  # every user import and backtest in the same two-slot worker.
  #
  # Opt-in locally (`--profile ingest`): starting the dev stack should not begin
  # downloading tens of GB from B3 on a cron. It runs unconditionally in prod.
  ingest:
    build:
      context: .
      dockerfile: platform/Dockerfile
    container_name: b3_ingest
    command: ["python", "-m", "platform_app.worker"]
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/b3
      ENGINE_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/b3
      WORKER_QUEUES: ingest
      # Deliberately NOT ENGINE_BENCH_OFFLINE: this is the one service whose whole
      # job is to reach B3, CVM, Binance and the SEC.
      # EDGAR requires a declaring User-Agent. The client defaults to one naming
      # this project, so the job runs unconfigured; set this to a contact of your
      # own when running against your own domain.
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      # Alpha Vantage keys the US price, listing and benchmark ingests. Kept out
      # of the committed env_file like the Stripe secrets; compose interpolates.
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY:-}
      ALPHAVANTAGE_RATE_PER_MIN: ${ALPHAVANTAGE_RATE_PER_MIN:-}
      ALPHAVANTAGE_DAILY_BUDGET: ${ALPHAVANTAGE_DAILY_BUDGET:-}
      UPLOADS_DIR: /data/uploads
      ARTIFACTS_DIR: /data/artifacts
    volumes:
      # COTAHIST/CVM archives land in /opt/engine/data. On the container filesystem
      # they die with the container, so every run would re-download 1994..today.
      - engine_data:/opt/engine/data
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["ingest"]

volumes:
  postgres_data:
  uploads_data:
  artifacts_data:
  engine_data:
