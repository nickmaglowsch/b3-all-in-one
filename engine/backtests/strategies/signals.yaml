# Named signals as DATA (interpreted by backtests/core/signal_dsl.py).
# Each entry: an `expr` over shared_data frames + a default `lookback`.
# Convention: higher = better (selection always takes the top). Reference one
# from a strategy spec with `signal: {factor: <name>, lookback: N}`, or inline
# an `expr:` directly in the spec. Add a new factor by adding a line here — no
# Python. See docs/config_strategies.md for the primitive catalogue.

momentum:
  expr: "roll_sum(shift(log_ret, 1), lookback)"
  lookback: 12

low_vol:
  expr: "-roll_std(ret, lookback)"
  lookback: 12

sharpe_mom:
  expr: "roll_sum(shift(log_ret, 1), lookback) / roll_std(shift(ret, 1), lookback)"
  lookback: 12

blended_vol:
  expr: "-(0.5 * vol_60d + 0.5 * vol_20d)"

# Mean reversion (biggest losers) restricted to names whose recent daily win
# rate sits in a neutral band around its own 60d average — a stock trending hard
# in either direction is not a reversion candidate. The win-rate frames are
# daily, so at_rebalance() pulls them onto the monthly grid. Repeated because
# the DSL has no local bindings; both copies are the same expression.
win_rate_mean_rev:
  expr: >-
    where(
      where(-roll_sum(ret, lookback), has_glitch == 0),
      (at_rebalance(roll_mean(pct_change(adj_close) > 0, win_rate_window)
        / (roll_mean(roll_mean(pct_change(adj_close) > 0, win_rate_window), 60) + 1e-8))
       >= win_rate_low_threshold)
      & (at_rebalance(roll_mean(pct_change(adj_close) > 0, win_rate_window)
        / (roll_mean(roll_mean(pct_change(adj_close) > 0, win_rate_window), 60) + 1e-8))
         <= win_rate_high_threshold)
    )
  lookback: 1
  win_rate_window: 20
  win_rate_low_threshold: 0.75
  win_rate_high_threshold: 1.25

# Realised volatility measured on DAILY returns over `lookback` months (21
# trading days each), pulled onto the rebalance grid, negated (higher = calmer).
# `low_vol` above measures the same thing off MONTHLY returns, so a 12-month
# lookback gives it 12 observations to estimate a standard deviation from —
# noisy enough that the ranking reshuffles on sampling error. The daily frame
# gives ~252 observations for the same window at the same horizon.
daily_low_vol:
  expr: "-at_rebalance(roll_std(pct_change(adj_close), lookback * 21))"
  lookback: 6

# ── Point-in-time fundamentals (B3 and US) ───────────────────────────────────
# These read the `f_*` PIT frames, so a spec using one needs
# `needs_fundamentals: true` and a market whose MarketSpec.fundamentals is true.
# They exist because the ratio frames the B3 specs use — f_pe_ratio_dyn,
# f_pb_ratio_dyn, f_ev_ebitda_dyn — are built from `fundamentals_monthly`, which
# `load_all_fundamentals_monthly` reads without a market scope. Off B3 those
# frames are empty, so a US value strategy has to be assembled from the PIT
# frames directly.
#
# TWO THINGS ABOUT THESE ARE LOAD-BEARING.
#
# **They are for ranking, never for a `range:` band.** Off B3 `raw_close` is BRL
# (data._CONVERTED_COLUMNS multiplies the venue's close by fx_rate) while
# `fundamentals_pit_us` values are the raw USD the filer reported; on B3 the CVM
# values are thousands of BRL against a BRL price. Either way the mismatch is one
# scale factor shared by every name on a date, so the cross-sectional rank is
# exact and an absolute threshold is meaningless. A band like low_pe.yaml's is
# correct there and would be nonsense here.
#
# **Every one of them is duration-invariant.** SEC facts arrive per
# (accession, period_end) and 10-K and 10-Q rows sit side by side, so a US
# `f_net_income` cell is an annual figure for one filer and a quarterly figure
# for the next — and `f_net_income_ttm`, which would fix that, is computed only
# by the CVM pipeline and is NULL on the US plane. So the factors below either
# read instants only (equity, shares, price) or divide two figures from the same
# filing slot (a margin), which cancels the period out. An earnings yield —
# net income over market cap — mixes a duration with an instant and would rank a
# quarterly filer against an annual one; it is deliberately not here.

# Book-to-price: equity / market cap. Instants only, so no duration to mix.
# Higher = cheaper, per the convention.
book_to_price_pit:
  expr: "f_equity / (raw_close * f_shares_outstanding)"

# Net margin. Numerator and denominator come from the same filing slot, so the
# ratio means the same thing whether that slot is a quarter or a year.
net_margin_pit:
  expr: "f_net_income / where(f_revenue, f_revenue > 0)"

# EBITDA margin — the same same-slot cancellation, on the operating line.
ebitda_margin_pit:
  expr: "f_ebitda / where(f_revenue, f_revenue > 0)"
