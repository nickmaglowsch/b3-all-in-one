name: CryptoMomSharpe
description: >-
  Momentum-Sharpe on the crypto plane. MomSharpe's mirror: risk-adjusted
  momentum (log-return sum / return std, both skip-1) over the USDT pairs, top
  decile, equal weight, monthly.
kind: rank_and_hold
market: CRYPTO
rebalance: ME
warmup_pad: 2
universe:
  min_adtv: 1000000
  min_price: 0
signal:
  factor: sharpe_mom
  lookback: 6   # see CryptoLowVol on why six rather than twelve
selection:
  top_pct: 0.10
  min_names: 5
weighting: equal
