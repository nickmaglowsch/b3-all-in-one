[project]
name = "platform-app"
version = "0.1.0"
description = "b3-all-in-one platform API (auth, tenants, jobs)"
requires-python = "==3.12.*"
dependencies = [
    "fastapi",
    "python-multipart",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "fastapi-users[sqlalchemy]==13.*",
    "httpx-oauth",
    "procrastinate[psycopg]",
    "psycopg[binary]",
    "pydantic-settings",
    "stripe",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
