[project]
name = "b3-portfolio"
version = "0.1.0"
description = "B3 fundamental analysis and portfolio management with Claude Code"
requires-python = ">=3.10"
dependencies = [
    "fundamentus>=0.3.2",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "tabulate>=0.9",
    "html5lib>=1.1",
    "yfinance>=1.3.0",
    "matplotlib>=3.8",
]

[tool.setuptools]
packages = ["scripts", "methodologies"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
