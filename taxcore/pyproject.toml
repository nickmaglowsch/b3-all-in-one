[project]
name = "b3-portfolio"
version = "0.1.0"
description = "B3 fundamental analysis and portfolio management with Claude Code"
requires-python = ">=3.10"
dependencies = [
    "fundamentus>=0.3.2",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "requests>=2.31",
    "lxml>=4.9",          # pandas.read_html backend (fetch_fundamentus_fii)
    "tabulate>=0.9",
    "yfinance>=1.3.0",
]

[tool.setuptools]
packages = ["scripts", "methodologies"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "golden: golden-file regression tests over the real B3 fixtures (minutes, offline)",
]
filterwarnings = [
    "ignore::UserWarning:openpyxl.styles.stylesheet",
]
